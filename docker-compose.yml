version: '3.8'

services:
  # Serveur de base de données MySQL
  database:
    image: mysql:8.0
    container_name: sae501_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sae501_cms
      MYSQL_USER: sae501_user
      MYSQL_PASSWORD: sae501_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Interface d'administration phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sae501_phpmyadmin
    restart: always
    depends_on:
      - database
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database

volumes:
  db_data: